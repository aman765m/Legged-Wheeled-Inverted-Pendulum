# Sec. III: finite-state machine for active arm usage (Fig. 5)
arm_fsm:
  ros__parameters:
    mode: active                 # active | fixed
    a_th: 1.9                    # [m/s^2] ~ 20 N threshold force / 10.3 kg total mass
    K_x: 6.0                     # end-effector acceleration gain (not given in the paper; tuned)
    a_th_exit_ratio: 0.5         # push state ends when |a| < a_th_exit_ratio * a_th (hysteresis)
    hold_time: 1.0               # [s] keep the end-effector out while the robot recovers
    home: [0.3, 0.0]
    right: [0.15, -0.4]
    left: [0.15, 0.4]
    twa_window: 0.5              # [s] time-weighted average of the reference yaw rate
    yaw_rate_epsilon: 0.05       # |TWA| below this is treated as zero
    return_natural_frequency: 3.0
    return_damping_ratio: 1.0
    turn_natural_frequency: 1.5  # [rad/s] transitions to the Right / Left postures
    accel_cutoff_hz: 10.0
    rate: 500.0
    workspace:
      x_min: 0.05
      x_max: 0.58
      max_reach: 0.58
    max_ee_velocity: 2.5
    max_ee_acceleration: 25.0
    cmd_vel_timeout: 0.5

cmp_estimator:
  ros__parameters:
    ground_height: 0.0
    gravity: 9.81
    filter_cutoff_hz: 10.0
    world_frame: world
    marker_rate: 30.0
    path_rate: 10.0
    max_path_length: 5000
    warmup_time: 0.5
